<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Weird Quiz</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background-color: #121212;
            border: 1px solid #262626;
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            max-width: 380px;
            width: 100%;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h2 {
            font-size: 1.2rem;
            margin-bottom: 20px;
            min-height: 60px;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        button.option-btn {
            background-color: #1e1e1e;
            border: 1px solid #333333;
            color: white;
            padding: 12px 16px;
            font-size: 0.95rem;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            text-align: left;
        }
        button.option-btn:hover {
            background-color: #2a2a2a;
        }
        button.option-btn:active {
            transform: scale(0.98);
        }
        .restart-btn {
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

<div class="card">
    <h2 id="question-text">Loading question...</h2>
    <div id="options" class="options-container"></div>
    <button id="restart-btn" class="restart-btn" onclick="startQuiz()">Take Quiz Again</button>
</div>

<script>
    const quizData = [
        {
            question: "If your computer made a sound every time it thought, what should it be?",
            options: ["Faint cereal crunching", "An aggressive dial-up tone", "A polite cough", "Complete silence"]
        },
        {
            question: "If gravity turned off for 5 seconds, what is the first thing you'd hit?",
            options: ["The ceiling fan", "My hot coffee", "The cat", "Nothing, I'm already on the floor"]
        },
        {
            question: "You realize your cat has been replaced by a body double. What is your move?",
            options: ["Tell them a fake secret to test loyalty", "Politely ask them to leave", "Offer them tea", "Challenge them to a duel"]
        }
    ];

    let currentQuestion = 0;
    let userAnswers = [];

    function startQuiz() {
        currentQuestion = 0;
        userAnswers = [];
        document.getElementById("restart-btn").style.display = "none";
        showQuestion();
    }

    function showQuestion() {
        const q = quizData[currentQuestion];
        document.getElementById("question-text").innerText = q.question;
        
        const optionsDiv = document.getElementById("options");
        optionsDiv.innerHTML = "";

        q.options.forEach((opt) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = opt;
            btn.onclick = () => selectOption(opt);
            optionsDiv.appendChild(btn);
        });
    }

    function selectOption(answer) {
        userAnswers.push(answer);
        currentQuestion++;

        if (currentQuestion < quizData.length) {
            showQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        document.getElementById("options").innerHTML = "";
        document.getElementById("question-text").innerText = "Quiz Complete! Diagnosis: You are 87% unpredictable and 13% suspicious.";
        document.getElementById("restart-btn").style.display = "inline-block";
    }

    // Start on load
    startQuiz();
</script>

</body>
</html>
