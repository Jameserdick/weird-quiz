<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weird Question Generator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background-color: #121212;
            border: 1px solid #262626;
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h2 {
            font-size: 1.25rem;
            line-height: 1.5;
            margin-bottom: 24px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        button {
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.1s ease;
        }
        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

<div class="card">
    <h2 id="question">Tap the button to get a weird question!</h2>
    <button onclick="nextQuestion()">Get Question</button>
</div>

<script>
    const questions = [
        "If gravity turned off for 5 seconds, what is the first object you would hit?",
        "What color does a lemon feel like?",
        "If your pet could talk, what is the first secret they would reveal?",
        "Would you rather speak only in rhymes or walk everywhere backwards?",
        "If you could whisper one sentence into everyone's ear at once, what would you say?",
        "What sound does a computer make when it thinks?"
    ];

    function nextQuestion() {
        const index = Math.floor(Math.random() * questions.length);
        document.getElementById("question").innerText = questions[index];
    }
</script>

</body>
</html>
